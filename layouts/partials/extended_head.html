<link href="/devlogs/pagefind/pagefind-ui.css" rel="stylesheet">
<script src="/devlogs/pagefind/pagefind-ui.js"></script>
<script>
  // Firefox view transition api
  // 1. Função de inicialização com as SUAS configurações
  const initPagefind = () => {
    const searchElement = document.querySelector("#search");
    
    // Só inicializa se o elemento existir e o script do Pagefind estiver carregado
    if (searchElement && window.PagefindUI) {
      searchElement.innerHTML = ""; // Limpa lixo de navegações anteriores
      
      new PagefindUI({
        element: "#search",
        showSubResults: false,
        showImages: false,
        debounceTimeoutMs: 500,
        sort: { date: "desc" },
        showMeta: false,
        excerptLength: 15
      });
    }
  };

  const handleNavigation = async (url, hashFromLink = "") => {
    try {
      const response = await fetch(url);
      if (!response.ok) return (window.location.href = url);
      
      const finalUrl = response.url;
      const text = await response.text();
      const data = new DOMParser().parseFromString(text, "text/html");
      
      // Detecta Hugo Alias (Redirect)
      if (data.querySelector('meta[http-equiv="refresh"]')) {
        window.location.href = finalUrl;
        return;
      }

      const newContent = data.querySelector("#content") || data.body;
      const oldContent = document.querySelector("#content") || document.body;
      const targetHash = hashFromLink || new URL(url, location.origin).hash;

      if (!document.startViewTransition) {
        updateDOM(data, newContent, oldContent, targetHash);
        initPagefind();
      } else {
        const transition = document.startViewTransition(() => {
          updateDOM(data, newContent, oldContent, targetHash);
        });
        
        await transition.finished;
        initPagefind();
        
        // Re-executa o scroll após a transição para garantir precisão
        if (targetHash) {
          const el = document.querySelector(targetHash);
          if (el) el.scrollIntoView();
        }
      }

      // Atualiza a URL (com o hash se existir)
      const urlToPush = targetHash ? (finalUrl.split('#')[0] + targetHash) : finalUrl;
      if (location.href !== urlToPush) {
        history.pushState({}, "", urlToPush);
      }
    } catch (err) {
      window.location.href = url;
    }
  };

  const updateDOM = (data, newContent, oldContent, targetHash) => {
    oldContent.innerHTML = newContent.innerHTML;
    document.title = data.title;

    if (targetHash) {
      const el = document.querySelector(targetHash);
      if (el) {
        el.scrollIntoView();
      } else {
        window.scrollTo(0, 0);
      }
    } else {
      window.scrollTo(0, 0);
    }

    // Re-executa scripts internos
    oldContent.querySelectorAll("script").forEach((oldScript) => {
      const newScript = document.createElement("script");
      Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
      newScript.textContent = oldScript.textContent;
      oldScript.replaceWith(newScript);
    });
  };

  document.addEventListener("click", (e) => {
    const link = e.target.closest("a");
    if (!link) return;

    const targetUrl = new URL(link.href, location.href);
    
    // Se for âncora na mesma página, deixa o navegador agir normalmente
    if (targetUrl.pathname === location.pathname && targetUrl.hash !== "") {
      return;
    }

    // Regras de exclusão (links externos, nova aba, etc)
    if (targetUrl.origin !== location.origin || link.getAttribute("target") === "_blank" || e.metaKey || e.ctrlKey) return;
    
    e.preventDefault();
    handleNavigation(link.href, targetUrl.hash);
  });

  window.addEventListener("popstate", () => handleNavigation(location.href));
  document.addEventListener("DOMContentLoaded", initPagefind);

  // Inicialização na primeira carga da página
  document.addEventListener("DOMContentLoaded", initPagefind);

  // Reabre o drawer quando o input tem valor
  document.addEventListener('focusin', (e) => {
    if (e.target && e.target.matches('#search input')) {
      const drawer = document.querySelector('.pagefind-ui__drawer');
      if (drawer && e.target.value.trim() !== '' && drawer.classList.contains('pagefind-ui__hidden')) {
        drawer.classList.remove('pagefind-ui__hidden');
      }
    }
  });

  // Fecha ao clicar fora
  document.addEventListener('click', (e) => {
    const searchEl = document.querySelector("#search");
    const drawer = document.querySelector(".pagefind-ui__drawer");
    if (searchEl && drawer && !searchEl.contains(e.target) && !drawer.classList.contains('pagefind-ui__hidden') && !e.target.classList.contains('pagefind-ui__button')) {
      drawer.classList.add('pagefind-ui__hidden');
    }
  });

</script>
