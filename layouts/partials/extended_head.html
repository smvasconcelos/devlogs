<link href="/devlogs/pagefind/pagefind-ui.css" rel="stylesheet">
<script src="/devlogs/pagefind/pagefind-ui.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', (event) => {
    new PagefindUI({
      element: "#search",
      showSubResults: false,
      showImages: false,
      debounceTimeoutMs: 500,
      sort: { date: "desc" },
      showMeta: false,
      excerptLength: 15
    });
  });

  // Reabre o drawer quando o input tem valor
  document.addEventListener('focusin', (e) => {
    if (e.target && e.target.matches('#search input')) {
      const drawer = document.querySelector('.pagefind-ui__drawer');
      if (drawer && e.target.value.trim() !== '' && drawer.classList.contains('pagefind-ui__hidden')) {
        drawer.classList.remove('pagefind-ui__hidden');
      }
    }
  });

  // Fecha ao clicar fora
  document.addEventListener('click', (e) => {
    const searchEl = document.querySelector("#search");
    const drawer = document.querySelector(".pagefind-ui__drawer");
    if (searchEl && drawer && !searchEl.contains(e.target) && !drawer.classList.contains('pagefind-ui__hidden') && !e.target.classList.contains('pagefind-ui__button')) {
      drawer.classList.add('pagefind-ui__hidden');
    }
  });


  // Firefox View Transiction
  const useViewTransition = (callback) => {
    if (document.startViewTransition) {
      document.startViewTransition(callback);
    } else {
      callback();
    }
  };

  const handleNavigation = async (url) => {
    try {
      const response = await fetch(url);
      if (!response.ok) return (window.location.href = url);
      
      const text = await response.text();
      const data = new DOMParser().parseFromString(text, "text/html");
      
      // Tenta pegar o container principal, se não existir, usa o body
      const newContent = data.querySelector("#content") || data.body;
      const oldContent = document.querySelector("#content") || document.body;

      useViewTransition(() => {
        oldContent.innerHTML = newContent.innerHTML;
        document.title = data.title;
        window.scrollTo(0, 0);
        
        // Se a URL de destino tiver um hash, rola até o elemento após a transição
        const hash = new URL(url).hash;
        if (hash) {
          const el = document.querySelector(hash);
          if (el) el.scrollIntoView();
        }
      });

      history.pushState({}, "", url);
    } catch (err) {
      window.location.href = url;
    }
  };

  document.addEventListener("click", (e) => {
    const link = e.target.closest("a");
    if (!link) return;

    const targetUrl = new URL(link.href, location.href);

    // Verificações para ignorar o script:
    const isExternal = targetUrl.origin !== location.origin;
    const isSamePageHash = targetUrl.pathname === location.pathname && targetUrl.hash !== "";
    const isNewTab = link.getAttribute("target") === "_blank" || e.metaKey || e.ctrlKey;

    // Se for link externo, mesma página com hash, ou nova aba -> Deixa o navegador lidar
    if (isExternal || isSamePageHash || isNewTab) {
      return;
    }

    // Caso contrário, impede o reload e faz a View Transition
    e.preventDefault();
    handleNavigation(link.href);
  });

  window.addEventListener("popstate", () => handleNavigation(location.href));

</script>
